name = "maillist-worker"
main = "worker/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[assets]
directory = "./dist"

[[r2_buckets]]
binding = "EMAIL_BUCKET"
bucket_name = "maillist-email-archive"

[[kv_namespaces]]
binding = "CONFIG_KV"
id = "00000000000000000000000000000000"
